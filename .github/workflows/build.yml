name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: 'stable'
  JAVA_VERSION: '17'

jobs:
  build:
    name: 🔨 Build ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: ℹ️ Versions
        run: flutter --version

      - name: 💾 Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔎 Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: 🛠️ Install NDK 28.2 + CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "platforms;android-36" \
            "build-tools;34.0.0" || true

      - name: 🔐 Restore Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          mkdir -p android/keys
          CLEAN_B64=$(printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n')
          printf '%s' "$CLEAN_B64" | base64 -d > android/keys/release-key.jks
          FIRST_BYTE=$(head -c 1 android/keys/release-key.jks | xxd -p)
          [ "$FIRST_BYTE" = "fe" ] || { echo "❌ Keystore corrupt"; exit 1; }
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$STORE_PASS" "$KEY_PASS" "$KEY_ALIAS" "keys/release-key.jks" \
            > android/key.properties
          keytool -list -keystore android/keys/release-key.jks -storepass "$STORE_PASS"

      - name: 🔨 Build Release APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: media-center-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -f android/keys/release-key.jks android/key.properties
