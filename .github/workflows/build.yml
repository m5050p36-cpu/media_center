name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: 'stable'
  JAVA_VERSION: '17'

jobs:
  build:
    name: 🔨 Build ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ─── 1) سحب الكود ───
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ─── 2) تهيئة Java 17 Zulu ───
      - name: ☕ Setup Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      # ─── 3) تهيئة أحدث Flutter مستقر ───
      - name: 🐦 Setup Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # ─── 4) عرض إصدار Flutter ───
      - name: ℹ️ Flutter Version
        run: flutter --version

      # ─── 5) كاش الحزم ───
      - name: 💾 Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      # ─── 6) جلب الحزم ───
      - name: 📦 Get dependencies
        run: flutter pub get

      # ─── 7) تحليل الكود ───
      - name: 🔎 Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # ─── 8) تجهيز NDK + CMake ───
      - name: 🛠️ Install NDK + CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" \
            "cmake;3.22.1" \
            "platforms;android-36" \
            "build-tools;34.0.0" || true

      # ─── 9) استعادة Keystore ───
      - name: 🔐 Restore Keystore
        run: |
          mkdir -p android/keys
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keys/release-key.jks
          cat > android/key.properties << EOF2
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keys/release-key.jks
          EOF2
          ls -lh android/keys/

      # ─── 10) البناء ───
      - name: 🔨 Build Release APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --no-tree-shake-icons

      # ─── 11) إعادة التسمية ───
      - name: 🏷️ Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
             artifacts/media-center-v${VERSION}-arm64.apk
          ls -lh artifacts/

      # ─── 12) رفع Artifact ───
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-center-apk
          path: artifacts/*.apk
          retention-days: 30

      # ─── 13) إنشاء Release عند الـ Tag ───
      - name: 🚀 Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true

      # ─── 14) تنظيف ───
      - name: 🧹 Cleanup Secrets
        if: always()
        run: |
          rm -f android/keys/release-key.jks
          rm -f android/key.properties
