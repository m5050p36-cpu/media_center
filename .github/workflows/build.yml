name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: 'stable'
  JAVA_VERSION: '17'
  APP_NAME: 'AR-Music-Video'

jobs:
  build:
    name: 🔨 Build ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: ℹ️ Versions
        run: |
          flutter --version
          java -version

      - name: 💾 Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔎 Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: 🛠️ Install NDK 28.2 + CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "platforms;android-36" \
            "build-tools;34.0.0" || true

      # ═══════════════════════════════════════════════════
      # استعادة Keystore
      # ═══════════════════════════════════════════════════
      - name: 🔐 Restore Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          mkdir -p android/keys
          CLEAN_B64=$(printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n')
          printf '%s' "$CLEAN_B64" | base64 -d > android/keys/release-key.jks
          FIRST_BYTE=$(head -c 1 android/keys/release-key.jks | xxd -p)
          [ "$FIRST_BYTE" = "fe" ] || { echo "❌ Keystore corrupt"; exit 1; }
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$STORE_PASS" "$KEY_PASS" "$KEY_ALIAS" "keys/release-key.jks" \
            > android/key.properties
          keytool -list -keystore android/keys/release-key.jks -storepass "$STORE_PASS" >/dev/null
          echo "✅ Keystore ready"

      # ═══════════════════════════════════════════════════
      # البناء
      # ═══════════════════════════════════════════════════
      - name: 🔨 Build Release APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      # ═══════════════════════════════════════════════════
      # نسخ APK واحد فقط باسم مطابق للتطبيق
      # ═══════════════════════════════════════════════════
      - name: 🏷️ Rename APK (single file)
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD_NUM=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f2)
          mkdir -p artifacts

          # ✅ ملف واحد فقط
          APK_NAME="${APP_NAME}-v${VERSION}.apk"

          cp build/app/outputs/flutter-apk/app-release.apk \
             "artifacts/${APK_NAME}"

          echo "════════════════════════════════════"
          echo "📦 APK created:"
          ls -lh artifacts/
          echo "════════════════════════════════════"

      # ═══════════════════════════════════════════════════
      # رفع الـ Artifact (ملف واحد)
      # ═══════════════════════════════════════════════════
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AR-Music-Video-APK
          path: artifacts/*.apk
          retention-days: 30

      # ═══════════════════════════════════════════════════
      # إنشاء Release عند وجود Tag
      # ═══════════════════════════════════════════════════
      - name: 🚀 Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true

      - name: 🧹 Cleanup Secrets
        if: always()
        run: |
          rm -f android/keys/release-key.jks
          rm -f android/key.properties
