name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: 'stable'
  JAVA_VERSION: '17'

jobs:
  build:
    name: 🔨 Build ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: ℹ️ Versions
        run: |
          flutter --version
          java -version

      - name: 💾 Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔎 Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: 🛠️ Install NDK 28.2 + CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "platforms;android-36" \
            "build-tools;34.0.0" || true

      # ═══════════════════════════════════════════════════════
      # استعادة Keystore — باستخدام printf بدل echo لمنع تلف البايت
      # ═══════════════════════════════════════════════════════
      - name: 🔐 Restore Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          mkdir -p android/keys

          # طباعة حجم Base64 للتحقق (لا يكشف المحتوى)
          echo "Base64 length: ${#KEYSTORE_B64}"

          # فك التشفير باستخدام printf لتفادي إضافة \n
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/keys/release-key.jks

          # التحقق من الحجم
          echo "JKS size: $(wc -c < android/keys/release-key.jks) bytes"

          # كتابة key.properties نظيفاً
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$STORE_PASS" "$KEY_PASS" "$KEY_ALIAS" "keys/release-key.jks" \
            > android/key.properties

          echo "─── key.properties ───"
          cat android/key.properties

          # التحقق من صلاحية الـ Keystore
          echo "─── Keystore test ───"
          keytool -list -keystore android/keys/release-key.jks -storepass "$STORE_PASS" || {
            echo "❌ Keystore is corrupt!"
            exit 1
          }

      - name: 🔨 Build Release APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      - name: 🏷️ Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
             artifacts/media-center-v${VERSION}-arm64.apk
          ls -lh artifacts/

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-center-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true

      - name: 🧹 Cleanup Secrets
        if: always()
        run: |
          rm -f android/keys/release-key.jks
          rm -f android/key.properties
